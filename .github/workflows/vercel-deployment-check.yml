name: Vercel Deployment Check

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready

permissions:
  contents: read
  statuses: write

jobs:
  verify-production-build:
    name: Validate deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build and test
        run: npm test

      - name: Validate internal links
        run: npm run test:links

      # This exact name is configured as the Vercel Deployment Check.
      # It must run even when a prior validation step fails so Vercel receives
      # a definitive pass/fail status rather than waiting indefinitely.
      - name: Notify Vercel
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - mutunda: lint
